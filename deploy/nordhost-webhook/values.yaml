# groupName must match the GroupName constant in server.go. It avoids
# naming collisions on the Kubernetes API and is referenced in the
# Issuer's `webhook` stanza to tell cert-manager where to send
# ChallengeRequests.
groupName: nordhost-integrator

certManager:
  namespace: cert-manager
  serviceAccountName: cert-manager

image:
  repository: git.dataverket.org/dataverket/tools/nordhost-integrator
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

# Name of a pre-existing Kubernetes Secret (in this chart's release
# namespace) containing a key "config.json" with the DirectAdmin
# credentials (see config.json.example in the repo root). Create it with:
#   kubectl create secret generic nordhost-webhook-config \
#     --from-file=config.json=./config.json -n cert-manager
# Required - the chart will fail to render without it.
existingSecretName: "1234"

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 443

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #  cpu: 100m
  #  memory: 128Mi
  # requests:
  #  cpu: 100m
  #  memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
