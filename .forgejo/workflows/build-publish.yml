name: build-publish

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: git.dataverket.org
  IMAGE_NAMESPACE: dataverket/tools

jobs:
  images:
    runs-on: docker
    strategy:
      matrix:
        include:
          - image: nordhost-integrator
            dockerfile: Dockerfile
          - image: nordhost-integrator-externaldns
            dockerfile: Dockerfile.externaldns-webhook
    steps:
      - uses: actions/checkout@v4

      # Every push publishes a :sha-<short> tag; a push to main also moves
      # :latest; a vX.Y.Z tag additionally publishes the bare X.Y.Z version.
      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/$IMAGE_NAMESPACE/${{ matrix.image }}"
          TAGS="$IMAGE:sha-$(git rev-parse --short HEAD)"
          if [ "$GITHUB_REF_TYPE" = "branch" ]; then
            TAGS="$TAGS
          $IMAGE:latest"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAGS="$TAGS
          $IMAGE:${GITHUB_REF_NAME#v}"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  chart:
    if: startsWith(github.ref, 'refs/tags/')
    needs: images
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        run: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      # Chart version/appVersion track the release tag directly rather than
      # being hand-maintained in Chart.yaml.
      - name: Set chart version to release tag
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version: .*/version: $VERSION/" deploy/nordhost-webhook/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"$VERSION\"/" deploy/nordhost-webhook/Chart.yaml

      - name: Log in to registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Package and push chart
        run: |
          set -euo pipefail
          helm package deploy/nordhost-webhook -d /tmp/chart-out
          helm push /tmp/chart-out/nordhost-webhook-*.tgz "oci://$REGISTRY/$IMAGE_NAMESPACE/charts"
