name: build-publish

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  REGISTRY: registry.dataverket.org
  IMAGE_NAMESPACE: tools

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: nordhost-integrator
            package: ./cmd/main
          - image: nordhost-integrator-externaldns
            package: ./cmd/externaldns-webhook
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # ko builds the Go binary and pushes the image straight to the registry
      # with no docker daemon: the runner's job containers get no docker socket,
      # and the docker/* marketplace actions are not mirrored on this forge.
      - name: Install ko
        run: |
          set -euo pipefail
          KO_VERSION=0.19.1
          curl -sfL -o /tmp/ko.tgz "https://github.com/ko-build/ko/releases/download/v${KO_VERSION}/ko_${KO_VERSION}_Linux_x86_64.tar.gz"
          echo "635ac6ea3fd376c935fee597fbb29ab2c2449f49ef1655085fe3aa9c25fed7a5  /tmp/ko.tgz" | sha256sum -c -
          tar -xzf /tmp/ko.tgz -C /usr/local/bin ko

      # Every push publishes a :sha-<short> tag; a push to main also moves
      # :latest; a vX.Y.Z tag additionally publishes the bare X.Y.Z version.
      - name: Build and push
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          TAGS="sha-$(git rev-parse --short HEAD)"
          if [ "$GITHUB_REF_TYPE" = "branch" ]; then
            TAGS="$TAGS,latest"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAGS="$TAGS,${GITHUB_REF_NAME#v}"
          fi
          ko login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin <<< "$REGISTRY_PASSWORD"
          KO_DOCKER_REPO="$REGISTRY/$IMAGE_NAMESPACE/${{ matrix.image }}" \
            ko build --bare --platform linux/amd64 --tags "$TAGS" "${{ matrix.package }}"

  chart:
    if: startsWith(github.ref, 'refs/tags/')
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        run: |
          set -euo pipefail
          HELM_VERSION=v3.16.4
          curl -sfL -o /tmp/helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl -sfL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256sum" | sed 's|helm-.*|/tmp/helm.tgz|' | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C /tmp
          install /tmp/linux-amd64/helm /usr/local/bin/helm

      # Chart version/appVersion track the release tag directly rather than
      # being hand-maintained in Chart.yaml.
      - name: Set chart version to release tag
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version: .*/version: $VERSION/" deploy/nordhost-webhook/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"$VERSION\"/" deploy/nordhost-webhook/Chart.yaml

      - name: Log in to registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | helm registry login "$REGISTRY" -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - name: Package and push chart
        run: |
          set -euo pipefail
          helm package deploy/nordhost-webhook -d /tmp/chart-out
          helm push /tmp/chart-out/nordhost-webhook-*.tgz "oci://$REGISTRY/$IMAGE_NAMESPACE/charts"
