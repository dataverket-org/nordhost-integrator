name: build-publish

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  REGISTRY: registry.dataverket.org
  IMAGE_NAMESPACE: tools

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: nordhost-integrator
            dockerfile: Dockerfile
          - image: nordhost-integrator-externaldns
            dockerfile: Dockerfile.externaldns-webhook
    steps:
      - uses: actions/checkout@v4

      # Every push publishes a :sha-<short> tag; a push to main also moves
      # :latest; a vX.Y.Z tag additionally publishes the bare X.Y.Z version.
      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/$IMAGE_NAMESPACE/${{ matrix.image }}"
          TAGS="$IMAGE:sha-$(git rev-parse --short HEAD)"
          if [ "$GITHUB_REF_TYPE" = "branch" ]; then
            TAGS="$TAGS
          $IMAGE:latest"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAGS="$TAGS
          $IMAGE:${GITHUB_REF_NAME#v}"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Plain docker CLI against the runner's docker-in-docker: the docker/*
      # marketplace actions are not mirrored on this forge (only its `actions`
      # org is), so `uses: docker/...` fails to resolve.
      - name: Log in to registry
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin

      - name: Build and push
        run: |
          set -euo pipefail
          ARGS=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && ARGS+=(-t "$tag")
          done <<< "${{ steps.tags.outputs.tags }}"
          docker build --platform linux/amd64 -f "${{ matrix.dockerfile }}" "${ARGS[@]}" .
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done <<< "${{ steps.tags.outputs.tags }}"

  chart:
    if: startsWith(github.ref, 'refs/tags/')
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        run: |
          set -euo pipefail
          HELM_VERSION=v3.16.4
          curl -sfL -o /tmp/helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl -sfL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256sum" | sed 's|helm-.*|/tmp/helm.tgz|' | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C /tmp
          install /tmp/linux-amd64/helm /usr/local/bin/helm

      # Chart version/appVersion track the release tag directly rather than
      # being hand-maintained in Chart.yaml.
      - name: Set chart version to release tag
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version: .*/version: $VERSION/" deploy/nordhost-webhook/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"$VERSION\"/" deploy/nordhost-webhook/Chart.yaml

      - name: Log in to registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | helm registry login "$REGISTRY" -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - name: Package and push chart
        run: |
          set -euo pipefail
          helm package deploy/nordhost-webhook -d /tmp/chart-out
          helm push /tmp/chart-out/nordhost-webhook-*.tgz "oci://$REGISTRY/$IMAGE_NAMESPACE/charts"
